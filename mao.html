<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PixelBlock Studio</title>
  <link rel="stylesheet" href="mao-T.css">
</head>
<body>
  <div id="loadingHint">神经元恢复中…</div>
  <div id="app">
    <div class="layer-panel">
      <div class="layer-title">图层</div>
      <div id="layerList"></div>
    </div>
    <div class="canvas-area">
      <div id="canvasWrapper">
        <canvas id="canvas" width="520" height="520"></canvas>
      </div>
    </div>
    <div class="right-panel">
      <div class="section">
        <div class="section-title">画布设置</div>
        <div class="control-row">
          <span>宽:</span>
          <input type="number" id="canvasW" value="520" min="100" max="900" step="1">
          <span>高:</span>
          <input type="number" id="canvasH" value="520" min="100" max="2000" step="1">
          <button id="resizeCanvasBtn">应用</button>
        </div>
        <div class="control-row">
          <button id="savePresetBtn">保存预设</button>
          <button id="clearCanvasBtn">清空画布</button>
        </div>
        <div class="preset-list" id="presetList"></div>
      </div>
      <div class="section">
        <div class="section-title">背景</div>
        <div class="control-row">
          <label>背景色:</label>
          <input type="color" id="bgColor" value="#ffffff">
        </div>
        <div class="control-row">
          <button id="colorBgBtn">纯色背景</button>
          <button id="transparentBgBtn">透明背景</button>
        </div>
        <div class="control-row">
          <label>显示网格</label>
          <input type="checkbox" id="gridToggle">
        </div>
      </div>
      <div class="section">
        <div class="section-title">材质</div>
        <input type="file" id="upload" accept="image/*" multiple>
        <div class="material-panel" id="materialPanel"></div>
        <div class="control-row">
          <button id="clearMaterialsBtn">清空材质</button>
        </div>
        <button id="addBtn">添加到画布</button>
        <button id="deleteBtn">删除选中</button>
      </div>
      <div class="section">
        <div class="section-title">参数</div>
        <div class="control-group">
          <div class="control-row">
            <label>大小:</label>
            <input type="range" id="sizeSlider" min="1" max="512" value="32">
            <input type="number" id="sizeInput" min="1" max="512" value="32">
          </div>
          <div class="control-row">
            <label>高度:</label>
            <input type="range" id="levelSlider" min="-50" max="50" value="2">
            <input type="number" id="levelInput" min="-50" max="50" value="2">
          </div>
          <div class="control-row">
            <label>光源角:</label>
            <input type="range" id="lightAngleSlider" min="0" max="360" value="135">
            <input type="number" id="lightAngleInput" min="0" max="360" value="135" style="width:50px">
          </div>
          <div class="control-row">
            <label>阴影长:</label>
            <input type="range" id="shadowLenSlider" min="0.5" max="5" step="0.1" value="1.5">
            <input type="number" id="shadowLenInput" min="0.5" max="5" step="0.1" value="1.5" style="width:50px">
          </div>
        </div>
      </div>
      <div class="section">
        <button id="exportBtn">导出PNG</button>
        <button id="themeToggle" class="theme-btn">深色模式</button>
        <button id="shortcutBtn" class="help-btn">?</button>
      </div>
    </div>
  </div>
  <div id="previewModal" class="modal" style="display:none">
    <div class="modal-content">
      <h3>导出预览</h3>
      <img id="previewImage" style="max-width:100%; max-height:60vh;">
      <p id="previewSizeInfo"></p>
      <div class="modal-buttons">
        <button id="confirmExport">下载</button>
        <button id="cancelExport">取消</button>
      </div>
    </div>
  </div>
  <div id="shortcutModal" class="modal" style="display:none">
    <div class="modal-content">
      <h3>快捷键</h3>
      <ul>
        <li><kbd>Ctrl+Z</kbd> 撤销</li>
        <li><kbd>Ctrl+Y</kbd> 重做</li>
        <li><kbd>Ctrl+C</kbd> 复制选中</li>
        <li><kbd>Ctrl+V</kbd> 粘贴</li>
        <li><kbd>Delete / Backspace</kbd> 删除选中</li>
        <li><kbd>方向键</kbd> 微调位置 (1px)</li>
        <li><kbd>Shift+方向键</kbd> 微调位置 (10px)</li>
        <li><kbd>Shift+拖拽</kbd> 吸附对齐</li>
        <li><kbd>Ctrl+点击</kbd> 多选/取消多选</li>
      </ul>
      <button id="closeShortcut">关闭</button>
    </div>
  </div>
  <script src="maouse.js"></script>
</body>
</html>
